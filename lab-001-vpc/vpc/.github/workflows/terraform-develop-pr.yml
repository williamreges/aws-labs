name: Terraform AWS deploy - develop PR

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-develop-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Provision Terraform on AWS
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./infra

    env:
      AWS_REGION: sa-east-1
      TF_VAR_regiao: sa-east-1

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'sa-east-1' }}

      - name: Validar formatação do Terraform
        run: terraform fmt -check -diff

      - name: Inicializar Terraform
        run: terraform init -input=false

      - name: Validar configuração do Terraform
        run: terraform validate

      - name: Planejar infraestrutura
        run: terraform plan -no-color -input=false

      - name: Aplicar infraestrutura na AWS
        run: terraform apply -auto-approve -input=false
